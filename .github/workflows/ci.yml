name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores fictícios, não são segredos: o build valida as variáveis de ambiente,
  # mas não acessa o banco nem a Claude API.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  IA_MODO: mock
  BETTER_AUTH_SECRET: segredo-ficticio-do-ci-com-pelo-menos-32-caracteres
  BETTER_AUTH_URL: http://localhost:3100
  NEXT_TELEMETRY_DISABLED: "1"

# As actions são fixadas pelo SHA do commit (e não pela tag, que pode ser movida)
# para garantir que o código executado no CI é exatamente o revisado.
jobs:
  qualidade:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Falha se houver vulnerabilidade alta ou crítica em qualquer dependência.
      - run: npm audit --audit-level=high

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Com o segredo DATABASE_URL_E2E (branch "e2e" do Neon), roda também os
      # testes que usam banco (cadastro, login, bloqueio). Sem ele, são pulados.
      DATABASE_URL: ${{ secrets.DATABASE_URL_E2E || 'postgresql://ci:ci@localhost:5432/ci' }}
      E2E_COM_BANCO: ${{ secrets.DATABASE_URL_E2E != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A branch "e2e" é "schema only": registra as migrations que já existem
      # nela e aplica as novas, sem apagar nada (D-025).
      - name: Prepara o banco E2E
        if: env.E2E_COM_BANCO == '1'
        run: npm run db:preparar-e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
